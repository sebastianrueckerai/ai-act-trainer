# Public demo: money is capped in five layers (per-caller, per-model, proxy-wide, app turn caps, provider).
# This file holds the proxy-wide and per-deployment layers; the per-caller ones are
# LiteLLM users and keys. Budgets need the database and fail closed without it.
model_list:
  - model_name: strong
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
      max_budget: 12
      budget_duration: 1mo
  - model_name: fast
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      rpm: 60
      max_budget: 3
      budget_duration: 1mo

litellm_settings:
  drop_params: true
  request_timeout: 60
  max_budget: 5
  budget_duration: 1d

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  fail_closed_budget_enforcement: true
  proxy_budget_rescheduler_min_time: 60
  proxy_budget_rescheduler_max_time: 120
