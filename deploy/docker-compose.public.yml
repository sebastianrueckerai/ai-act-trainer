# Public overlay: Caddy terminates HTTPS on the host, the trainer is reachable only
# through it, and the model proxy loads the capped config. Compose cannot vary a port
# mapping by profile, so this file resets the trainer's `ports`.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.public.yml \
#     --profile dev --profile public --env-file .env up -d --build
# PUBLIC_HOST is the site name (aifuehrerschein.world, or localhost for a self-signed smoke).
# The trainer runs ENV=production: dev auth cannot be enabled here, and compose refuses to
# start without a SECRET_KEY in the environment (set it in .env; any random 16+ char
# string). Auth is invite, which needs LITELLM_ADMIN_KEY and falls back to
# LITELLM_MASTER_KEY when unset.
services:
  trainer:
    ports: !reset []
    environment:
      ENV: production
      AUTH_BACKEND: invite
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY to a random string of 16+ characters}
      LITELLM_ADMIN_KEY: ${LITELLM_ADMIN_KEY:-${LITELLM_MASTER_KEY}}

  litellm:
    ports: !reset []
    volumes:
      - ./litellm/config.public.yaml:/config/litellm.yaml:ro

  caddy:
    profiles: [public]
    image: caddy:2
    container_name: ai-act-trainer-caddy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [trainer]
    restart: unless-stopped
    networks: [trainer-net]

volumes:
  caddy-data: {}
