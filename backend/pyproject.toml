[project]
name = "ai-act-trainer"
dynamic = ["version"]
description = "Socratic EU AI Act trainer for employees"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "structlog>=24.1",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "lxml>=5.3",
    "langchain>=1.4",
    "langchain-openai>=1.6",
    "snowballstemmer>=2.2",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-checkpoint-postgres>=3.1.2",
    "weasyprint>=70",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pillow>=10",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/version.py"
pattern = 'APP_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:starlette.testclient",
    # WeasyPrint warns at import on a host without libharfbuzz-subset0; the image installs it.
    "ignore:HarfBuzz-Subset will be required:DeprecationWarning",
]
markers = ["eval: live grading-fairness run, gated on EVAL_LLM_BASE_URL"]
