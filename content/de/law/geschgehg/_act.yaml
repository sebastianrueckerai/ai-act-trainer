node: geschgehg
summary: Das Gesetz zum Schutz von Geschäftsgeheimnissen schützt vertrauliche, wirtschaftlich wertvolle
  Informationen vor unbefugtem Erlangen, Nutzung und Offenlegung. Es bindet Unternehmen, deren Beschäftigte
  und andere Personen, die mit solchen Informationen umgehen. Es gilt, solange keine spezielleren Regelungen
  Vorrang haben. Das Gesetz definiert ein Geschäftsgeheimnis, regelt zulässige Eigenentwicklungen, Arbeitnehmerrechte
  und Ausnahmen für berechtigtes Interesse, Meinungsfreiheit und Aufdeckung illegaler Handlungen. Bei
  Verstößen können Unterlassungs- und Schadensersatzansprüche geltend gemacht werden; Gerichte können
  vertrauliche Verfahren anordnen und Strafen verhängen.
