node: bdsg
summary: Das Bundesdatenschutzgesetz regelt die Verarbeitung personenbezogener Daten durch Bundes- und
  Landesbehörden sowie Stellen, die öffentliche Aufgaben wahrnehmen. Es gilt, wenn die Verarbeitung in
  Deutschland stattfindet oder die EU-Datenschutzgrundverordnung anwendbar ist, außer bei unmittelbarem
  EU-Recht. Das Gesetz definiert öffentliche Stellen, legt Rechtsgrundlagen, Pflichten zur Benennung von
  Datenschutzbeauftragten und zur Videoüberwachung fest und schafft den Bundesbeauftragten für Datenschutz
  und Informationsfreiheit. Es regelt Zusammenarbeit der Aufsichtsbehörden, gerichtlichen Rechtsschutz
  und enthält besondere Vorgaben für Gesundheits-, Straf- und Verteidigungsdaten sowie für Datenübermittlungen
  in Drittländer bei Verteidigungs- und Krisenaufgaben.
