summary: Marktüberwachungsbehörden dürfen technische Kontrollen durchführen, Dritt-Hilfspersonen einsetzen
  und Fernzugriff nutzen. Außerhalb der Geschäftszeiten ist das nur bei akuter Gefahr für Sicherheit und
  Ordnung erlaubt. Dabei wird das Grundrecht der Unverletzlichkeit der Wohnung eingeschränkt.
