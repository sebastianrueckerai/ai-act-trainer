node: kimig:cpt_7
summary: Die Bundesregierung bewertet die Wirkung der durch das Gesetz geschaffenen Aufsichts- und Behördenstruktur
  sowie der Kooperationsvorschriften. Sie führt die erste Bewertung innerhalb von 18 Monaten nach Inkrafttreten
  und die zweite nach drei Jahren durch, bezieht Behörden, Unternehmen, Verbraucherschützer und weitere
  Akteure ein und berichtet dem Bundestag.
source_sha: 1a9d9e78e6d33dcf10038f76ada4991b523084560b4d3e15b923e568a1d1b503
