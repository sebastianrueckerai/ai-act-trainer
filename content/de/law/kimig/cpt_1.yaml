node: kimig:cpt_1
summary: Der Teil bestimmt den Anwendungsbereich des Gesetzes. Es dient der Durchführung der EU-Verordnung
  über künstliche Intelligenz und ergänzt sie um nationale Regeln. Es gilt für alle KI-Systeme im Sinne
  der Verordnung, die in Deutschland in den Markt kommen. Es benennt die zuständigen Behörden, die Innovationsförderung
  und die Bußgelder für Verstöße gegen die Verordnung. Das Gesetz tritt in Kraft, sobald die EU-Verordnung
  anwendbar wird.
