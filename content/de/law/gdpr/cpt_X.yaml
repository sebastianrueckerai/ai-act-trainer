node: gdpr:cpt_X
summary: Die Vorschrift überträgt der Europäischen Kommission die Befugnis, delegierte Rechtsakte zu erlassen.
  Sie gilt seit dem 24. Mai 2016 ohne festes Enddatum. Das Europäische Parlament und der Rat können die
  Übertragung jederzeit zurückziehen; der Rückzug wird wirksam, sobald er im Amtsblatt veröffentlicht
  wird. Außerdem wird die Kommission von einem nach einer früheren Verordnung eingerichteten Ausschuss
  unterstützt. Verweist ein Rechtsakt auf diese Bestimmung, gelten die dort festgelegten Regeln für die
  Einrichtung und das Verfahren des Ausschusses.
source_sha: ae5d4e44120b00ae22589920802c6f33c819ec5448287457757664a31e66169f
