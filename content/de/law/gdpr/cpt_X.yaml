- node: gdpr:art_92
  summary: Die Regel überträgt der Kommission die Befugnis, delegierte Rechtsakte zu erlassen. Die Übertragung
    gilt ab dem 24. Mai 2016 auf unbestimmte Zeit. Das Europäische Parlament oder der Rat können sie jederzeit
    widerrufen; der Widerruf wird mit Veröffentlichung im Amtsblatt wirksam.
  source_sha: 5563ea4e4f6f7ac58f0bf1ad303909c577f329c516b4fa9440bcdf4717250997
  children: []
- node: gdpr:art_93
  summary: Der Absatz legt fest, dass die Kommission von einem nach der Verordnung 182/2011 eingerichteten
    Ausschuss unterstützt wird. Verweist ein Rechtsakt auf diesen Absatz, gelten die dort festgelegten
    Regeln für die Einrichtung und das Verfahren des Ausschusses.
  source_sha: 9f48ee13472a5407104afe39ca51d8fbb97c4eafcda4c45b3e92ad0b1377ecc6
