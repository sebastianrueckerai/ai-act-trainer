node: ai_act:cpt_II
summary: Das Verbot richtet sich an alle Anbieter, Betreiber und Nutzer von KI-Systemen in der EU. Es
  verbietet das Inverkehrbringen, Inbetriebnehmen oder Verwenden von Systemen, die manipulative Unterbewusstseins-Einflüsse
  ausüben, Schwächen ausnutzen, nicht einvernehmliche pornografische Deepfakes erzeugen, illegale Inhalte
  verbreiten, soziale Bewertungen ermöglichen, profilorientierte Kriminalitätsprognosen erstellen, unzulässige
  Gesichtserkennungs-Datenbanken betreiben, emotionale Analysen am Arbeitsplatz oder in Schulen durchführen,
  biometrische Kategorisierung sensibler Merkmale vornehmen oder Echtzeit-Fernidentifizierung in öffentlichen
  Räumen durchführen, außer in Strafverfolgungs-Ausnahmen. Das Verbot gilt, sobald das System auf dem
  Markt ist, in Betrieb genommen oder genutzt wird.
source_sha: 9e7449d50e3404d589de937a2991201ed8a2fa809ef7d1674ad3e11c555ba638
