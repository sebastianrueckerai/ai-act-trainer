node: ai_act:cpt_X
summary: Das Büro für Künstliche Intelligenz und die Mitgliedstaaten unterstützen die Erstellung freiwilliger
  Verhaltenskodizes. Sie gelten für Anbieter und Betreiber von KI-Systemen ohne hohes Risiko und für alle
  KI-Systeme, die sich freiwillig an festgelegte Ziele und Indikatoren halten. Die Kommission erstellt
  bis zum 1. August 2027 Leitlinien, die die Anwendung der Verordnung erklären. Sie behandeln Anforderungen,
  verbotene Praktiken, wesentliche Änderungen, Transparenzpflichten, das Verhältnis zu anderem EU-Recht
  und die Definition eines KI-Systems. Die Leitlinien richten sich an Anbieter, Nutzer, Aufsichtsbehörden
  und Marktteilnehmer und berücksichtigen die Bedürfnisse von KMU, Start-Ups und lokalen Behörden.
source_sha: bbde9cb0341f3af7edf5cca907a7a334e317bf86a24f54c10bfb5adec94f0b84
