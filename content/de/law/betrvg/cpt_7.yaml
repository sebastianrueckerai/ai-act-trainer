node: betrvg:cpt_7
summary: Der siebte Teil enthält formelle Änderungen mehrerer Gesetze, ohne inhaltliche Wirkung. Eine
  Vorschrift ändert das Bürgerliche Gesetzbuch, wirkt jedoch nur auf die Gesetzesstruktur und gilt für
  alle Rechtsverhältnisse, die dem BGB unterliegen, ab dem Inkrafttreten. Eine weitere Vorschrift sollte
  das Kündigungsschutzgesetz ändern, ist aber gegenstandslos und hat keinerlei rechtliche Wirkung für
  Arbeitgeber oder Arbeitnehmer. Eine dritte Vorschrift ändert das Arbeitsgerichtsgesetz, hat aber ebenfalls
  keinen inhaltlichen Effekt und gilt für alle, die dem Arbeitsgerichtsgesetz unterliegen, zum festgelegten
  Zeitpunkt.
source_sha: 5d1d2cf3164d01bf291e50d81ccd48aae262de9c60a938c81b4831b531c60a0f
