node: betrvg
summary: Das Betriebsverfassungsgesetz regelt die Mitbestimmung in Betrieben. Es verpflichtet Unternehmen
  mit mindestens fünf dauerhaften Beschäftigten, einen Betriebsrat zu wählen, und definiert dessen Wahl,
  Aufgaben und Zusammenarbeit mit Arbeitgeber, Gewerkschaften und Arbeitgeberverbänden. Es legt Mitwirkungs-
  und Mitbestimmungsrechte in sozialen, personellen und wirtschaftlichen Fragen fest, enthält besondere
  Vorschriften für Seeschifffahrt und Luftfahrt sowie Sanktionen bei Verstößen. Der Schlussteil regelt
  Übergänge und das Inkrafttreten.
