id: q-06-03
chapter: 06-die-kurze-liste-der-verbote
type: yes_no
difficulty: 2
question: >-
  Am Werkstor vergleicht ein System dein Gesicht mit dem Foto in deinem Ausweis
  und bestätigt nur, dass du es bist. Ist das die verbotene biometrische
  Kategorisierung?
correct: "no"
model_answer: >-
  Nein, das bestätigt bloß deine Identität und schließt aus deinen biometrischen
  Daten auf kein geschütztes Merkmal.
explanation: >-
  Art. 5 Abs. 1 Buchst. g verbietet die biometrische Kategorisierung nur, soweit
  sie aus biometrischen Daten auf Rasse, politische Einstellungen,
  Gewerkschaftszugehörigkeit, religiöse oder weltanschauliche Überzeugungen, das
  Sexualleben oder die sexuelle Ausrichtung schließt. Eine Verifizierung, deren
  einziger Zweck die Bestätigung ist, dass eine Person die ist, für die sie sich
  ausgibt, nimmt Anhang III Nummer 1 Buchstabe a sogar von der
  Hochrisiko-Einstufung aus.
citations: ["Art. 5(1)(g)", "Annex III pt. 1(a)"]
