id: q-02-04
chapter: 02-was-du-hineingeben-darfst
type: free_text
difficulty: 2
question: >-
  Du willst eine Liste mit Kundendaten in den Chatassistenten kopieren. Was
  prüfst du vorher?
rubric:
  must:
    - point: nennt, dass du prüfst, ob unser Zweck die Daten über die Kunden trägt
      ask: Also, was prüfst du an der Kundenliste, bevor sie in den Assistenten geht?
    - point: nennt, dass du prüfst, ob etwas drin ist, das das Haus geheim hält
      ask: >-
        In der Liste stehen auch die Umsätze und Rabatte jedes Kunden. Was prüfst du
        daran noch?
  should:
    - nennt, dass du zuerst prüfst, ob überhaupt Daten über Personen drin sind
    - nennt das Anonymisieren oder den Datenschutzbeauftragten als Weg im Zweifel
    - >-
      nennt Art. 6 Abs. 1 Buchst. f DSGVO für das berechtigte Interesse oder § 2 Nr.
      1 GeschGehG für das Geschäftsgeheimnis
model_answer: >-
  Ich prüfe zuerst die personenbezogenen Daten: Ist unser Zweck gedeckt, etwa
  durch ein berechtigtes Interesse unseres Arbeitgebers? Dann prüfe ich, ob die
  Liste ein Geschäftsgeheimnis ist, ob das Haus sie also geheim hält. Im Zweifel
  anonymisiere ich, was geht, oder frage den Datenschutzbeauftragten.
explanation: >-
  Eine Liste mit Kundendaten enthält personenbezogene Daten. Es kommt darum auf
  eine Rechtsgrundlage an, etwa ein berechtigtes Interesse unseres Arbeitgebers,
  sofern nicht die Interessen oder Grundrechte der betroffenen Person überwiegen
  (Art. 6 Abs. 1 Buchst. f DSGVO). Die Kundenliste ist außerdem der Klassiker
  unter den Geschäftsgeheimnissen: Was das Haus den Umständen nach angemessen
  geheim hält, bleibt draußen (§ 2 Nr. 1 GeschGehG). Und auch eine Hausregel
  kannst du vorher prüfen. Im Zweifel anonymisierst du, was geht, oder fragst
  den Datenschutzbeauftragten.
citations: ["GDPR Art. 6(1)(f)", "GeschGehG § 2 Nr. 1"]
